<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Toto - Consultas Médicas</title>
  <link rel="icon" type="image/png" href="./assets/img/logopwa.png">
  <link rel="apple-touch-icon" href="./assets/img/logopwa.png">
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#8B5CF6">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body class="page-learn page-medical">

  <div class="learn-container">
    <div class="learn-header">
      <div class="header-title-group">
        <h1>Historial de Consultas Médicas</h1>
      </div>
      <div class="header-nav-buttons">
        <a href="./consultas.html" class="btn-back btn-back-primary">Consultas</a>
        <a href="./perfilmedico.html" class="btn-back">Perfil</a>
        <a href="./medical.html" class="btn-back">Asistente</a>
        <a href="./index.html" class="btn-back btn-back-primary">Volver</a>
      </div>
    </div>

    <!-- Filter & New Consultation Bar -->
    <div class="filter-bar" style="display: flex; flex-direction: row; gap: 12px; align-items: center; flex-wrap: wrap;">
      <div class="search-wrapper" style="flex: 1; min-width: 200px;">
        <input type="text" id="search-consultations" class="form-input search-input" placeholder="Buscar por tema, síntoma o fecha...">
      </div>
      <a href="./medical.html?new=true" id="btn-new-consultation" class="btn-primary-action" style="width: auto; padding: 10px 18px; display: flex; align-items: center; gap: 6px; white-space: nowrap; text-decoration: none; background: #0284c7;">
        <span style="font-size: 1.2rem; font-weight: bold;">+</span> Nueva Consulta
      </a>
    </div>

    <!-- Consultations List Container -->
    <div id="consultations-list" class="knowledge-list" style="max-height: none; margin-top: 16px;">
      <div style="text-align: center; color: #64748b; padding: 24px;">Cargando historial de consultas...</div>
    </div>
  </div>

  <!-- Consultation Detail Modal -->
  <div id="modal-consultation-detail" class="note-modal">
    <div class="note-modal-card" style="max-width: 600px;">
      <div class="modal-header">
        <h3 id="modal-consultation-title">Detalle de Consulta</h3>
        <button id="btn-close-detail-modal" class="btn-close-modal">&times;</button>
      </div>
      <div id="modal-consultation-body" style="max-height: 380px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 10px 0;">
        <!-- Thread messages inserted dynamically -->
      </div>
      <div style="display: flex; gap: 12px; justify-content: flex-end; margin-top: 10px;">
        <button id="btn-continue-from-modal" class="btn-primary-action" style="width: auto; background: #0284c7;">Continuar esta consulta</button>
      </div>
    </div>
  </div>

  <script type="module" src="./js/consultas.js"></script>
</body>
</html>
