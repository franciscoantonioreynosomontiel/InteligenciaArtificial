<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Amigo - Música</title>
  <link rel="icon" type="image/png" href="./assets/img/logopwa.png">
  <link rel="apple-touch-icon" href="./assets/img/logopwa.png">
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#8B5CF6">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/styles.css">

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
      }
    }
  </script>

  <!-- Import model-viewer web component -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

  <style>
    /* Custom Styling for Mobile-First Music Player */
    body {
      background: #f3e8ff;
      overflow: hidden;
      margin: 0;
      padding: 0;
    }

    .music-app-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      width: 100%;
      max-width: 100%;
      margin: 0;
      position: relative;
      background: linear-gradient(180deg, #ffffff 0%, #faf5ff 100%);
      box-shadow: none;
      overflow: hidden;
    }

    .music-top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      z-index: 20;
      border-bottom: 1px solid #f3e8ff;
      flex-shrink: 0;
    }

    /* Hamburger Side Drawer */
    .hamburger-drawer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
      z-index: 40;
      transform: translateX(-100%);
      transition: transform 0.3s ease-in-out;
      display: flex;
      flex-direction: column;
      padding: 16px;
      box-sizing: border-box;
    }

    .hamburger-drawer.open {
      transform: translateX(0);
    }

    .hamburger-header {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-bottom: 12px;
      border-bottom: 1px solid #f1f5f9;
    }

    .filter-tabs {
      display: flex;
      gap: 8px;
      margin: 14px 0 10px 0;
    }

    .filter-tab {
      flex: 1;
      padding: 8px 12px;
      border-radius: 20px;
      border: 1px solid #ddd6fe;
      background: #f5f3ff;
      color: #6d28d9;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s ease;
    }

    .filter-tab.active {
      background: #8b5cf6;
      color: #ffffff;
      border-color: #8b5cf6;
    }

    .search-box {
      margin-bottom: 12px;
    }

    .search-input {
      width: 100%;
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid #ddd6fe;
      background: #faf5ff;
      font-size: 0.9rem;
      color: #1e1b4b;
      outline: none;
      box-sizing: border-box;
    }

    .music-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-right: 4px;
    }

    .music-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px;
      border-radius: 12px;
      background: #f8fafc;
      cursor: pointer;
      transition: background 0.2s;
      border: 1px solid #f1f5f9;
    }

    .music-item:hover, .music-item.active {
      background: #f3e8ff;
      border-color: #c084fc;
    }

    .music-item-img {
      width: 48px;
      height: 48px;
      border-radius: 8px;
      object-fit: cover;
    }

    .music-item-info {
      flex: 1;
      overflow: hidden;
    }

    .music-item-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: #1e1b4b;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .music-item-sub {
      font-size: 0.8rem;
      color: #64748b;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Action buttons on track items */
    .item-actions {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .btn-item-action {
      background: none;
      border: none;
      color: #8b5cf6;
      cursor: pointer;
      padding: 6px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .btn-item-action:hover {
      background: #ede9fe;
    }

    .btn-item-action.delete:hover {
      background: #fee2e2;
      color: #ef4444;
    }

    /* Albums Grid */
    .albums-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 12px;
      padding: 4px;
    }

    .album-card {
      background: #f8fafc;
      border: 1px solid #f1f5f9;
      border-radius: 14px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .album-card:hover {
      background: #f3e8ff;
      border-color: #c084fc;
      transform: translateY(-2px);
    }

    .album-card-img {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 10px;
      object-fit: cover;
      margin-bottom: 8px;
      box-shadow: 0 4px 10px rgba(139, 92, 246, 0.15);
    }

    .album-card-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: #1e1b4b;
      width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .album-card-count {
      font-size: 0.75rem;
      color: #6d28d9;
      margin-top: 2px;
      font-weight: 500;
    }

    /* Album Header Row with + Add Album Button */
    .albums-section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .btn-add-album {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #8b5cf6;
      color: #ffffff;
      border: none;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-add-album:hover {
      background: #7c3aed;
    }

    /* Modal Overlay & Styling */
    .music-modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.5);
      backdrop-filter: blur(4px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      box-sizing: border-box;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .music-modal-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .music-modal-content {
      background: #ffffff;
      width: 100%;
      max-width: 420px;
      max-height: 85vh;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-sizing: border-box;
      overflow-y: auto;
    }

    .music-modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #f1f5f9;
      padding-bottom: 10px;
    }

    .music-modal-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #1e1b4b;
      margin: 0;
    }

    .modal-form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .modal-label {
      font-size: 0.85rem;
      font-weight: 600;
      color: #4c1d95;
    }

    .modal-input {
      width: 100%;
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid #ddd6fe;
      background: #faf5ff;
      font-size: 0.9rem;
      color: #1e1b4b;
      outline: none;
      box-sizing: border-box;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 8px;
    }

    .btn-modal-cancel {
      padding: 10px 16px;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
      background: #f8fafc;
      color: #64748b;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-modal-save {
      padding: 10px 18px;
      border-radius: 12px;
      border: none;
      background: #8b5cf6;
      color: #ffffff;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-modal-delete {
      padding: 10px 18px;
      border-radius: 12px;
      border: none;
      background: #ef4444;
      color: #ffffff;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }

    /* Checkbox list for album song selection */
    .song-select-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 200px;
      overflow-y: auto;
      border: 1px solid #ede9fe;
      padding: 10px;
      border-radius: 12px;
      background: #faf5ff;
    }

    .song-select-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.85rem;
      color: #1e1b4b;
      cursor: pointer;
    }


    /* Main Player Layout */
    .player-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 14px 18px 20px 18px;
      position: relative;
      overflow: hidden;
      box-sizing: border-box;
      gap: 14px;
      justify-content: space-between;
    }

    /* Thought Bubble Container Override */
    .music-thought-container {
      width: 100%;
      position: relative;
      z-index: 10;
      flex-shrink: 0;
    }

    .music-thought-bubble {
      background: #ffffff;
      border: 2px solid #ddd6fe;
      border-radius: 18px;
      padding: 10px 16px;
      box-shadow: 0 4px 15px rgba(139, 92, 246, 0.1);
      text-align: center;
    }

    .music-thought-bubble p {
      margin: 0;
      font-size: 0.9rem;
      font-weight: 600;
      color: #4c1d95;
    }

    /* Track Info Block */
    .track-card {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 14px;
      background: #ffffff;
      border: 1px solid #ede9fe;
      padding: 12px 16px;
      border-radius: 16px;
      box-sizing: border-box;
      flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(139, 92, 246, 0.05);
    }

    .track-cover-art {
      width: 56px;
      height: 56px;
      border-radius: 12px;
      object-fit: cover;
      box-shadow: 0 4px 12px rgba(139, 92, 246, 0.2);
      flex-shrink: 0;
    }

    .track-meta {
      flex: 1;
      overflow: hidden;
    }

    .track-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: #1e1b4b;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-artist {
      font-size: 0.85rem;
      color: #6b21a8;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 3D Model Container - override global styles.css #canvas-container */
    #canvas-container.bot-display-container {
      position: relative !important;
      top: auto !important;
      left: auto !important;
      width: 100% !important;
      flex: 1 !important;
      min-height: 200px !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      overflow: hidden !important;
      border-radius: 20px !important;
      background: radial-gradient(circle, rgba(245,243,255,1) 0%, rgba(237,233,254,0.5) 100%) !important;
      z-index: 5 !important;
    }

    #bot-model-viewer {
      width: 100%;
      height: 100%;
      outline: none;
      cursor: pointer;
    }

    /* Touch badge on GLTF */
    .gltf-touch-badge {
      position: absolute;
      bottom: 2px;
      background: rgba(139, 92, 246, 0.9);
      color: #ffffff;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 20px;
      pointer-events: none;
      backdrop-filter: blur(4px);
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      display: flex;
      align-items: center;
      gap: 6px;
      z-index: 15;
    }

    .gltf-touch-badge.listening {
      background: #ef4444;
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    /* Controls Container Box */
    .controls-wrapper {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
      background: #faf5ff;
      padding: 12px 14px;
      border-radius: 18px;
      border: 1px solid #f3e8ff;
      box-sizing: border-box;
    }

    /* Seek Progress Bar */
    .progress-container {
      width: 100%;
    }

    .seek-slider {
      width: 100%;
      accent-color: #8b5cf6;
      cursor: pointer;
      height: 6px;
    }

    .time-stamps {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: #64748b;
      font-weight: 500;
      margin-top: 2px;
    }

    /* Main Playback Controls */
    .player-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      width: 100%;
    }

    .btn-player-action {
      background: #ffffff;
      border: 1px solid #e9d5ff;
      color: #6d28d9;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 2px 6px rgba(139, 92, 246, 0.08);
    }

    .btn-player-action:active {
      transform: scale(0.92);
    }

    .btn-player-action.active {
      background: #8b5cf6;
      color: #ffffff;
      border-color: #8b5cf6;
    }

    .btn-play-main {
      width: 54px;
      height: 54px;
      background: linear-gradient(135deg, #a855f7 0%, #7c3aed 100%);
      color: #ffffff;
      border: none;
      box-shadow: 0 6px 18px rgba(124, 58, 237, 0.35);
    }

    /* Volume Bar */
    .volume-container {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 90%;
    }

    .volume-slider {
      flex: 1;
      accent-color: #8b5cf6;
      height: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="music-app-container">

    <!-- Top Bar Navigation -->
    <header class="music-top-bar">
      <!-- Hamburger Menu Button -->
      <button id="btn-hamburger" class="btn-icon" title="Menú de Música" aria-label="Menú de Música">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
      </button>

      <div style="display: flex; gap: 8px;">
        <!-- Return Home Button -->
        <a href="./index.html" class="btn-icon" title="Inicio" aria-label="Inicio">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        </a>

        <!-- Speech Toggle -->
        <button id="btn-toggle-speech" class="btn-icon active" title="Voz" aria-label="Voz">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
        </button>
      </div>
    </header>

    <!-- Collapsible Hamburger Menu Drawer -->
    <div id="hamburger-menu" class="hamburger-drawer">
      <div class="hamburger-header">
        <button id="btn-close-menu" class="btn-icon" title="Cerrar Menú" aria-label="Cerrar Menú">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>

      <div class="filter-tabs">
        <button class="filter-tab active" id="tab-songs">Canciones</button>
        <button class="filter-tab" id="tab-albums">Álbumes</button>
        <button class="filter-tab" id="tab-artists">Cantante</button>
      </div>

      <div class="search-box">
        <input type="text" id="music-search" class="search-input" placeholder="Buscar canción, álbum o cantante...">
      </div>

      <!-- Cloudinary Upload Controls -->
      <input type="file" id="music-upload-input" accept="audio/*" style="display: none;">
      <button id="btn-upload-music" style="padding: 10px 16px; border-radius: 12px; background: #8b5cf6; color: #ffffff; font-size: 0.9rem; font-weight: 600; cursor: pointer; border: none; text-align: center; margin-bottom: 12px; width: 100%; box-sizing: border-box;">Subir Canción a Cloudinary</button>
      <div id="upload-status" style="font-size: 0.8rem; color: #6d28d9; text-align: center; margin-bottom: 8px; display: none;"></div>

      <div id="music-library-list" class="music-list">
        <!-- Dynamically populated songs/albums/artists -->
      </div>
    </div>

    <!-- Main Player Section -->
    <main class="player-main">


      <!-- Current Track Info & Cover -->
      <div class="track-card">
        <img id="track-cover" class="track-cover-art" src="./assets/img/logopwa.png" alt="Carátula">
        <div class="track-meta">
          <div id="track-title" class="track-title">Selecciona una canción</div>
          <div id="track-artist" class="track-artist">Biblioteca Amigo</div>
        </div>
      </div>

      <!-- 3D Model GLTF Display -->
      <div class="bot-display-container" id="canvas-container">
        <model-viewer
          id="bot-model-viewer"
          src="./assets/img/ia.gltf"
          alt="Personaje 3D Gemini"
          auto-rotate
          auto-rotate-delay="3000"
          rotation-per-second="4deg"
          camera-controls
          disable-zoom
          disable-pan
          shadow-intensity="1"
          shadow-softness="0.8"
          exposure="1"
          touch-action="none"
          interaction-prompt="none"
        >
          <div id="three-canvas-fallback" style="width: 100%; height: 100%;"></div>
        </model-viewer>

        <!-- Visual Touch Badge Indicator -->
        <div id="gltf-badge" class="gltf-touch-badge">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path></svg>
          <span id="gltf-badge-text">Tócame para hablar</span>
        </div>
      </div>

      <!-- Controls Wrapper -->
      <div class="controls-wrapper">
        <!-- Seekbar Progress Bar -->
        <div class="progress-container">
          <input type="range" id="seek-slider" class="seek-slider" value="0" min="0" max="100" step="0.1">
          <div class="time-stamps">
            <span id="current-time">0:00</span>
            <span id="total-time">0:00</span>
          </div>
        </div>

        <!-- Main Controls -->
        <div class="player-controls">
          <button id="btn-shuffle" class="btn-player-action" title="Aleatorio" aria-label="Aleatorio">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"></polyline><line x1="4" y1="20" x2="21" y2="3"></line><polyline points="21 16 21 21 16 21"></polyline><line x1="15" y1="15" x2="21" y2="21"></line><line x1="4" y1="4" x2="9" y2="9"></line></svg>
          </button>

          <button id="btn-prev" class="btn-player-action" title="Anterior" aria-label="Anterior">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="19 20 9 12 19 4 19 20"></polygon><line x1="5" y1="19" x2="5" y2="5"></line></svg>
          </button>

          <button id="btn-play-pause" class="btn-player-action btn-play-main" title="Reproducir" aria-label="Reproducir">
            <svg id="icon-play" width="26" height="26" viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
            <svg id="icon-pause" width="26" height="26" viewBox="0 0 24 24" fill="currentColor" stroke="none" style="display: none;"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
          </button>

          <button id="btn-next" class="btn-player-action" title="Siguiente" aria-label="Siguiente">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 4 15 12 5 20 5 4"></polygon><line x1="19" y1="5" x2="19" y2="19"></line></svg>
          </button>

          <button id="btn-repeat" class="btn-player-action" title="Repetir" aria-label="Repetir">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"></polyline><path d="M3 11V9a4 4 0 0 1 4-4h14"></path><polyline points="7 23 3 19 7 15"></polyline><path d="M21 13v2a4 4 0 0 1-4 4H3"></path></svg>
          </button>
        </div>

        <!-- Volume Bar -->
        <div class="volume-container">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6d28d9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon></svg>
          <input type="range" id="volume-slider" class="volume-slider" min="0" max="1" step="0.05" value="0.8">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6d28d9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
        </div>
      </div>

    </main>

  </div>

  <!-- Modal: Edit Track Details -->
  <div id="modal-edit-track" class="music-modal-overlay">
    <div class="music-modal-content">
      <div class="music-modal-header">
        <h3 class="music-modal-title">Editar Canción</h3>
        <button class="btn-icon btn-close-modal" aria-label="Cerrar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
      <div class="modal-form-group">
        <label class="modal-label" for="edit-track-title">Nombre de la canción</label>
        <input type="text" id="edit-track-title" class="modal-input">
      </div>
      <div class="modal-form-group">
        <label class="modal-label" for="edit-track-artist">Cantante</label>
        <input type="text" id="edit-track-artist" class="modal-input">
      </div>
      <div class="modal-form-group">
        <label class="modal-label" for="edit-track-album">Álbum</label>
        <input type="text" id="edit-track-album" class="modal-input">
      </div>
      <div class="modal-actions">
        <button id="btn-cancel-edit-track" class="btn-modal-cancel">Cancelar</button>
        <button id="btn-save-edit-track" class="btn-modal-save">Guardar Cambios</button>
      </div>
    </div>
  </div>

  <!-- Modal: Delete Track Confirmation -->
  <div id="modal-delete-track" class="music-modal-overlay">
    <div class="music-modal-content">
      <div class="music-modal-header">
        <h3 class="music-modal-title">Eliminar Canción</h3>
        <button class="btn-icon btn-close-modal" aria-label="Cerrar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
      <p id="delete-track-confirm-text" style="font-size: 0.95rem; color: #334155; margin: 8px 0;">¿Estás seguro de que deseas eliminar esta canción?</p>
      <div class="modal-actions">
        <button id="btn-cancel-delete-track" class="btn-modal-cancel">Cancelar</button>
        <button id="btn-confirm-delete-track" class="btn-modal-delete">Eliminar</button>
      </div>
    </div>
  </div>

  <!-- Modal: Create New Album -->
  <div id="modal-create-album" class="music-modal-overlay">
    <div class="music-modal-content">
      <div class="music-modal-header">
        <h3 class="music-modal-title">Crear Álbum</h3>
        <button class="btn-icon btn-close-modal" aria-label="Cerrar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
      <div class="modal-form-group">
        <label class="modal-label" for="new-album-name">Nombre del álbum</label>
        <input type="text" id="new-album-name" class="modal-input">
      </div>
      <div class="modal-form-group">
        <label class="modal-label">Selecciona las canciones para este álbum</label>
        <div id="create-album-songs-list" class="song-select-list">
          <!-- Dynamically filled track list checkboxes -->
        </div>
      </div>
      <div class="modal-actions">
        <button id="btn-cancel-create-album" class="btn-modal-cancel">Cancelar</button>
        <button id="btn-save-create-album" class="btn-modal-save">Crear Álbum</button>
      </div>
    </div>
  </div>

  <!-- Modal: View Album Songs -->
  <div id="modal-view-album" class="music-modal-overlay">
    <div class="music-modal-content">
      <div class="music-modal-header">
        <h3 id="album-view-title" class="music-modal-title">Álbum</h3>
        <button class="btn-icon btn-close-modal" aria-label="Cerrar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
      <div id="album-view-songs-list" class="music-list" style="max-height: 350px;">
        <!-- Dynamically filled tracks of the album -->
      </div>
      <div class="modal-actions">
        <button id="btn-play-album-view" class="btn-modal-save">Reproducir Álbum</button>
        <button id="btn-close-album-view" class="btn-modal-cancel">Cerrar</button>
      </div>
    </div>
  </div>

  <script type="module" src="./js/musica.js"></script>
</body>
</html>
