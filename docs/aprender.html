<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Amigo - Conocimiento</title>
  <link rel="icon" type="image/png" href="./assets/img/logopwa.png">
  <link rel="apple-touch-icon" href="./assets/img/logopwa.png">
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#8B5CF6">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body class="page-learn">

  <div class="learn-container">
    <div class="learn-header">
      <div class="header-title-group">
        <h1>Base de Conocimiento</h1>
      </div>
      <div style="display: flex; gap: 10px;">
        <a href="./alarmas.html" class="btn-back">Alarmas</a>
        <a href="./recordatorios.html" class="btn-back">Recordatorios</a>
        <a href="./notas.html" class="btn-back">Notas</a>
        <a href="./index.html" class="btn-back" style="background: var(--primary-purple); color: white;">Volver</a>
      </div>
    </div>

    <!-- Two-Column Grid Layout -->
    <div class="learn-grid">

      <!-- Column 1: Cargar Data -->
      <div class="section-card column-card">
        <div class="card-title">
          <h3>Cargar Data</h3>
        </div>

        <!-- Tab Navigation for Upload Types -->
        <div class="tab-buttons">
          <button class="tab-btn active" data-tab="tab-faq">FAQ</button>
          <button class="tab-btn" data-tab="tab-sheet">Sheet / URL</button>
          <button class="tab-btn" data-tab="tab-file">Archivo</button>
          <button class="tab-btn" data-tab="tab-algorithms">Algoritmos</button>
          <button class="tab-btn" data-tab="tab-voice">Voz ElevenLabs</button>
        </div>

        <!-- Tab 1: Formulario FAQ -->
        <div id="tab-faq" class="tab-content active">
          <div class="form-group">
            <label for="faq-question">Titulo</label>
            <input type="text" id="faq-question" class="form-input">
          </div>
          <div class="form-group">
            <label for="faq-answer">Descripcion</label>
            <textarea id="faq-answer" class="form-textarea"></textarea>
          </div>
          <button id="btn-add-faq" class="btn-primary-action">Guardar FAQ</button>
        </div>

        <!-- Tab 2: Google Sheets / URL -->
        <div id="tab-sheet" class="tab-content">
          <div class="form-group">
            <label for="doc-title">Titulo</label>
            <input type="text" id="doc-title" class="form-input">
          </div>
          <div class="form-group">
            <label for="doc-url">URL</label>
            <input type="url" id="doc-url" class="form-input">
          </div>
          <div class="form-group">
            <label for="doc-desc">Descripcion</label>
            <textarea id="doc-desc" class="form-textarea"></textarea>
          </div>
          <button id="btn-add-sheet" class="btn-secondary-action">Vincular Sheet / URL</button>
        </div>

        <!-- Tab 3: Carga de Archivo TXT / CSV -->
        <div id="tab-file" class="tab-content">
          <div class="form-group">
            <label for="file-title">Titulo</label>
            <input type="text" id="file-title" class="form-input">
          </div>
          <div class="form-group">
            <label>Archivo</label>
            <div class="custom-file-wrapper">
              <input type="file" id="file-input" class="file-input-hidden" accept=".txt,.csv,.json,.md">
              <label for="file-input" class="custom-file-btn">
                <span>Seleccionar archivo</span>
              </label>
              <span id="file-chosen-name" class="file-name-display">Sin archivo</span>
            </div>
          </div>
          <div class="form-group">
            <label for="file-desc">Descripcion</label>
            <textarea id="file-desc" class="form-textarea"></textarea>
          </div>
          <button id="btn-upload-file" class="btn-accent-action">Cargar Archivo</button>
        </div>

        <!-- Tab 4: Configurar Algoritmos (Alarmas y Recordatorios Inteligentes) -->
        <div id="tab-algorithms" class="tab-content">
          <div class="form-group">
            <label for="rule-type-select">Tipo</label>
            <select id="rule-type-select" class="form-input custom-select">
              <option value="recordatorio">Recordatorio</option>
              <option value="alarma">Alarma</option>
            </select>
          </div>

          <div class="form-group">
            <label for="rule-name">Titulo</label>
            <input type="text" id="rule-name" class="form-input">
          </div>

          <div class="form-group">
            <label for="rule-message">Mensaje</label>
            <textarea id="rule-message" class="form-textarea"></textarea>
          </div>

          <!-- Schedule Options -->
          <div class="form-group">
            <label>Programacion</label>
            <div class="segmented-control">
              <button type="button" class="segment-schedule active" data-mode="days">Dias</button>
              <button type="button" class="segment-schedule" data-mode="date">Fecha</button>
            </div>
          </div>

          <div id="rule-days-container" class="form-group">
            <label>Dias</label>
            <div class="day-chips">
              <button type="button" class="day-chip active" data-day="1">Lun</button>
              <button type="button" class="day-chip active" data-day="2">Mar</button>
              <button type="button" class="day-chip active" data-day="3">Mié</button>
              <button type="button" class="day-chip active" data-day="4">Jue</button>
              <button type="button" class="day-chip active" data-day="5">Vie</button>
              <button type="button" class="day-chip" data-day="6">Sáb</button>
              <button type="button" class="day-chip" data-day="0">Dom</button>
            </div>
          </div>

          <div id="rule-date-container" class="form-group" style="display: none;">
            <label for="rule-date">Fecha</label>
            <input type="date" id="rule-date" class="form-input">
          </div>

          <!-- Time & Time Range Options -->
          <div class="form-group">
            <label class="checkbox-label">
              <input type="checkbox" id="rule-use-range">
              <span>Usar Rango Horario</span>
            </label>
          </div>

          <div id="rule-single-time-container" class="form-row">
            <div class="form-group flex-1">
              <label for="rule-time">Hora</label>
              <input type="time" id="rule-time" class="form-input" value="08:00">
            </div>
          </div>

          <div id="rule-range-container" class="form-row" style="display: none;">
            <div class="form-group flex-1">
              <label for="rule-range-start">Hora Inicio</label>
              <input type="time" id="rule-range-start" class="form-input" value="08:00">
            </div>
            <div class="form-group flex-1">
              <label for="rule-range-end">Hora Fin</label>
              <input type="time" id="rule-range-end" class="form-input" value="10:00">
            </div>
          </div>

          <!-- Fields ONLY visible for ALARMA -->
          <div id="alarm-only-fields" style="display: none; flex-direction: column; gap: 16px;">
            <div class="form-group">
              <label>Audio</label>
              <div class="custom-file-wrapper">
                <input type="file" id="rule-sound-input" class="file-input-hidden" accept="audio/*">
                <label for="rule-sound-input" class="custom-file-btn">
                  <span>Subir Audio</span>
                </label>
                <span id="rule-sound-name" class="file-name-display">Predeterminado</span>
              </div>
            </div>

            <div class="form-group">
              <label for="rule-volume">Volumen</label>
              <input type="range" id="rule-volume" min="0" max="100" value="80" class="form-range">
            </div>

            <div class="form-group">
              <label>Detener</label>
              <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 4px;">
                <label class="checkbox-label">
                  <input type="checkbox" class="stop-action-cb" value="button" checked>
                  <span>Boton en pantalla</span>
                </label>
                <label class="checkbox-label">
                  <input type="checkbox" class="stop-action-cb" value="phrase" checked>
                  <span>Hablar con la IA</span>
                </label>
                <label class="checkbox-label">
                  <input type="checkbox" class="stop-action-cb" value="touch" checked>
                  <span>Tocar personaje 3D</span>
                </label>
                <label class="checkbox-label">
                  <input type="checkbox" class="stop-action-cb" value="snooze" checked>
                  <span>Posponer 5 minutos</span>
                </label>
              </div>
            </div>
          </div>

          <button id="btn-add-algorithm" class="btn-primary-action">Guardar Regla</button>
        </div>

        <!-- Tab 5: Configurar Voz ElevenLabs -->
        <div id="tab-voice" class="tab-content">
          <div class="form-group">
            <label class="checkbox-label">
              <input type="checkbox" id="voice-enable-elevenlabs">
              <span>Usar voz de ElevenLabs para respuestas habladas</span>
            </label>
          </div>

          <div class="form-group">
            <label for="voice-select">Voz de ElevenLabs</label>
            <div style="display: flex; gap: 8px;">
              <select id="voice-select" class="form-input custom-select flex-1">
                <option value="">Selecciona una voz</option>
              </select>
              <button type="button" id="btn-fetch-voices" class="btn-secondary-action" style="white-space: nowrap; width: auto; padding: 0 16px;">Cargar Voces</button>
            </div>
          </div>

          <div class="form-group">
            <label for="voice-test-text">Texto de prueba</label>
            <input type="text" id="voice-test-text" class="form-input" value="Hola, esta es una prueba de mi voz en ElevenLabs.">
          </div>

          <div style="display: flex; gap: 10px; margin-top: 12px;">
            <button type="button" id="btn-test-voice" class="btn-secondary-action" style="flex: 1;">Probar Voz</button>
            <button type="button" id="btn-save-voice" class="btn-primary-action" style="flex: 1;">Guardar Configuracion</button>
          </div>
        </div>

      </div>

      <!-- Column 2: Filtrar, Editar y Eliminar Data -->
      <div class="section-card column-card">
        <div class="card-title">
          <h3>Administrar Data</h3>
        </div>

        <div class="filter-bar">
          <div class="search-wrapper">
            <input type="text" id="search-title" class="form-input search-input">
          </div>

          <div class="filter-buttons">
            <button class="filter-chip active" data-filter="all">Todos</button>
            <button class="filter-chip" data-filter="faq">FAQs</button>
            <button class="filter-chip" data-filter="sheet">Sheets</button>
            <button class="filter-chip" data-filter="file">Archivos</button>
            <button class="filter-chip" data-filter="algorithm">Algoritmos</button>
          </div>
        </div>

        <!-- Dynamic List of Knowledge Items -->
        <div id="knowledge-list" class="knowledge-list">
          <!-- Dynamic Items inserted via JS -->
        </div>
      </div>

    </div>
  </div>

  <script type="module" src="./js/aprender.js"></script>
</body>
</html>
